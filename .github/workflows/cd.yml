name: CD

# Manual-only by design: this workflow builds an image, pushes it to GHCR and
# deploys it to Fly.io. It never runs on a plain push. The `deploy` job is
# additionally gated by the `production` Environment's required reviewers.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Additional human-readable tag for the image"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.event.inputs.image_tag || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io (requires approval)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.FLY_APP }}.fly.dev
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy configuration is present
        env:
          FLY_APP_NAME: ${{ vars.FLY_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_APP_NAME" || { echo "Missing repository/environment variable FLY_APP"; exit 1; }
          test -n "$FLY_API_TOKEN" || { echo "Missing secret FLY_API_TOKEN"; exit 1; }

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy image to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >
          flyctl deploy
          --image ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          --app "${{ vars.FLY_APP }}"
          --ha=false
