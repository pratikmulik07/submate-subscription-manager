# Fly.io app configuration for SubMate.
#
# Before deploying:
#   1. Set `app` below (or let `flyctl launch` choose one) and create the app:
#        flyctl apps create <your-app-name>
#   2. Create the persistent volume once (name must match [[mounts]] source):
#        flyctl volumes create submate_data --region <region> --size 1
#   3. Create a deploy token and store it as the FLY_API_TOKEN GitHub secret:
#        flyctl tokens create deploy -x 999999h
#
# The CD workflow deploys a prebuilt GHCR image with:
#   flyctl deploy --image <ghcr image> --app <your-app-name> --ha=false
# A single machine is deliberate: SQLite is a single-writer database.
app = "replace-with-your-app-name"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  SUBMATE_DATA_DIR = "/app/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "submate_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
